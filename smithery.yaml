# Smithery configuration for LetsFG MCP Server
# Flights and hotels: search, book and cancel from any MCP agent.
# Flight search returns in 8-10s and can include split tickets (two tickets,
# two sellers, one trip) - always flagged with self_transfer: unprotected.
# https://smithery.ai/docs/publishing

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      LETSFG_API_KEY:
        type: string
        description: "LetsFG Developer API key (look-to-book search: 200 free after every booking, then $0.01). Get one at letsfg.co/developers. Reaches both flights and hotels. Not needed if you set LETSFG_BEARER_TOKEN — the free token reaches both too."
      LETSFG_BEARER_TOKEN:
        type: string
        description: "FREE token for flights AND hotels. Get one via 'letsfg auth' (zero-amount card setup, nothing charged, 90-day token). The same card authorises both products, so no Developer API account is needed. Hotel booking charges a 5% non-refundable reservation fee; the balance is paid to the hotel later by link."
    required: []
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "letsfg-mcp"],
      env: {
        ...(config.LETSFG_API_KEY && { LETSFG_API_KEY: config.LETSFG_API_KEY }),
        ...(config.LETSFG_BEARER_TOKEN && { LETSFG_BEARER_TOKEN: config.LETSFG_BEARER_TOKEN })
      }
    })
